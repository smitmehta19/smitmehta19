<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Smit Mehta, Senior Data Analyst and AI Engineer, Dublin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a524"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#263041" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#grid)" opacity="0.55"/>

  <!-- text -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#f5a524" font-size="20" font-weight="600" letter-spacing="3">HI, I'M</text>
    <text x="70" y="158" fill="#f9fafb" font-size="64" font-weight="700">Smit Mehta</text>
    <rect x="72" y="178" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="222" fill="#e5e7eb" font-size="26" font-weight="500">Senior Data Analyst &amp; AI Engineer</text>
    <text x="72" y="258" fill="#9ca3af" font-size="19">LLM apps  ·  Data pipelines  ·  ML at scale  ·  Dublin, Ireland</text>
  </g>

  <!-- network graph (AI / agents motif) -->
  <g stroke="#374151" stroke-width="2">
    <line x1="880" y1="90"  x2="980" y2="60"/>
    <line x1="880" y1="90"  x2="960" y2="160"/>
    <line x1="980" y1="60"  x2="1080" y2="100"/>
    <line x1="960" y1="160" x2="1080" y2="100"/>
    <line x1="960" y1="160" x2="1040" y2="230"/>
    <line x1="880" y1="90"  x2="850" y2="200"/>
    <line x1="850" y1="200" x2="960" y2="160"/>
    <line x1="850" y1="200" x2="1040" y2="230"/>
    <line x1="1080" y1="100" x2="1130" y2="190"/>
    <line x1="1040" y1="230" x2="1130" y2="190"/>
  </g>
  <g>
    <circle cx="880"  cy="90"  r="9"  fill="#f5a524"/>
    <circle cx="980"  cy="60"  r="7"  fill="#9ca3af"/>
    <circle cx="960"  cy="160" r="14" fill="#f97316"/>
    <circle cx="960"  cy="160" r="24" fill="none" stroke="#f97316" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="1080" cy="100" r="9"  fill="#f5a524"/>
    <circle cx="850"  cy="200" r="7"  fill="#9ca3af"/>
    <circle cx="1040" cy="230" r="9"  fill="#f5a524"/>
    <circle cx="1130" cy="190" r="7"  fill="#9ca3af"/>
  </g>
</svg>
