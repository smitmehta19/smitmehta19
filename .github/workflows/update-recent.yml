# Keeps the "Recently worked on" line in the profile README up to date.
name: Update recent projects

on:
  schedule:
    - cron: "23 5 * * *"   # every day at 5:23 am UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the README line
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_recent.py

      - name: Commit if it changed
        run: |
          if git diff --quiet README.md; then
            echo "Nothing new to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update recently worked on"
          git push
